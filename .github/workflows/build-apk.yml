name: Build APK & Deploy Web Application

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    name: Build APK & Create Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NiK-TV-debug.apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v2.0.${{ github.run_number }}
          name: NiK-TV Universal Web & TV Release v2.0.${{ github.run_number }}
          body: |
            Automated build of NiK-TV Universal Web & Android TV Application.
            
            ### Features Included:
            - **Universal Web Interface**: Works seamlessly on TV (D-Pad remote), Laptop, iPad/Tablet, and Mobile screens.
            - **Live HLS Stream Player**: HLS.js video player with quality switching.
            - **Embedded Android Native App**: Embedded responsive web asset inside WebView engine.
          files: app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
